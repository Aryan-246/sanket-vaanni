services:
  - type: web
    name: sanket-vaanni-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: info
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: API_INTERNAL_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: Sanket Vaanni <sanketvaanni.auth@gmail.com>
      # Render's free tier blocks outbound SMTP (25/465/587), so the SMTP path
      # above cannot deliver from this host. Set EMAIL_PROVIDER=brevo and
      # provide BREVO_API_KEY (sender stays sanketvaanni.auth@gmail.com) to use
      # the HTTPS API instead. Left as smtp so behaviour stays explicit until
      # the key exists.
      - key: EMAIL_PROVIDER
        value: smtp
      - key: BREVO_API_KEY
        sync: false
