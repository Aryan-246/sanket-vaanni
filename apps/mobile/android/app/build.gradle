apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * Firebase Messaging.
 *
 * ## Why this is conditional
 *
 * The plugin demands `google-services.json` and fails the build outright if it
 * is not there. That file is gitignored — it identifies a specific Firebase
 * project and belongs to whoever configures that project, not to the
 * repository — so a fresh clone would not build at all if the plugin were
 * applied unconditionally.
 *
 * Applying it only when the file is present keeps the app building for someone
 * who has not set up Firebase, at the cost of that build having no push. That
 * trade is made visible rather than silent: this warning prints on every build
 * without the file, and the app itself reports at runtime that push is
 * unavailable rather than showing a switch that does nothing.
 *
 * Android push is the only platform wired up here. iOS APNs is deliberately
 * absent — it needs an Apple Developer account, which this project does not
 * currently have.
 */
def googleServicesJson = file("google-services.json")
if (googleServicesJson.exists()) {
    apply plugin: "com.google.gms.google-services"
} else {
    logger.warn(
        "google-services.json is absent: building without Firebase Cloud Messaging. " +
        "Push notifications will be unavailable in this build."
    )
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.sanketvaani"
    defaultConfig {
        applicationId "com.sanketvaani"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

/**
 * The WebView hand assets, packaged straight from where they are written.
 *
 * The viewer loads its HTML, scripts and models over `file:///android_asset/`,
 * so those files have to end up inside the APK's assets under a `hands/` prefix.
 * There is no copy step: `src/webview` is registered as an additional assets
 * source, and because it contains a `hands/` directory, its contents land at
 * exactly `assets/hands/...` — the path the viewer already asks for.
 *
 * ## Why the assets live outside `src/assets`
 *
 * `src/assets` holds what `require()` pulls in — the intro video and its poster,
 * which React Native's own asset pipeline packages. Registering that directory
 * would have swept those two files into the assets tree a second time, adding
 * their 2.6 MB to the APK for nothing. An `exclude("intro/**")` on the assets
 * source set did not take effect through the Android plugin, so the split is
 * made by directory instead: one directory, one packaging route, nothing to
 * filter.
 *
 * ## Why there is no sync task any more
 *
 * There used to be one, copying `src/assets/hands` into
 * `android/app/src/main/assets/hands` on every build. It existed to stop the two
 * copies drifting, which they had: the installed app was running different HTML
 * from the file being edited, so a fix could land in the repository and change
 * nothing on the device.
 *
 * The task solved the drift but created a worse problem. It wrote into
 * `src/main/assets`, which is a *source* directory, so that directory became
 * something an unrelated task mutates — and Gradle 9 rejects that, because the
 * tasks that read it have no declared dependency on whatever filled it. Staging
 * the copy in the build directory and registering it as a source is the modern
 * way to do this, but the variant API refuses a plain task's `Provider` as a
 * source directory. Removing the copy removes the question entirely.
 */
android.sourceSets.main.assets.srcDir("$rootDir/../src/webview")
